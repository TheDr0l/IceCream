spring.application.name=IceCream-SpringBoot
server.port=8080

# Configuracion de MongoDB (unica base de datos)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/heladeria_db}
spring.data.mongodb.auto-index-creation=true

# Configuracion JWT (autenticacion sin sesion)
# El secreto debe tener al menos 32 bytes. Genera uno con: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=PT8H
app.jwt.issuer=icecream
app.jwt.cookie-name=icecream_token
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de Groq (usando el starter de OpenAI)
spring.ai.openai.api-key=${GROQ_API_KEY:not-configured}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
