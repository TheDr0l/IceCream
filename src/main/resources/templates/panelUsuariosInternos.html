<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios internos — Ice Cream</title>
    <link rel="icon" href="/img/heladoCool.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/styleHome.css">
    <link rel="stylesheet" href="/css/CSS_Usuarios.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="main-container">
        <aside class="sidebar">
            <div th:replace="~{sidebar :: sidebar}"></div>
        </aside>

        <main class="content-area">
            <div class="admin-page">
                <header class="content-header">
                    <div>
                        <h1>Usuarios internos</h1>
                        <p>Crea administradores y vendedores, revisa sus roles o elimina accesos.</p>
                    </div>
                    <div class="header-actions">
                        <a href="/home" class="btn btn-secondary">Volver al panel</a>
                    </div>
                </header>

                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="status">
                    <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <div class="users-layout">
                    <section class="panel" aria-labelledby="nuevo-usuario-title">
                        <div class="panel-header">
                            <div>
                                <h2 class="panel-title" id="nuevo-usuario-title">Agregar usuario</h2>
                                <p class="panel-subtitle">La contraseña se guarda cifrada.</p>
                            </div>
                        </div>

                        <div class="panel-body">
                            <form action="/panelUsuariosInternos" method="POST">
                                <div class="field-stack">
                                    <div>
                                        <label class="form-label" for="username">Usuario</label>
                                        <input class="form-control" type="text" id="username" name="username"
                                            autocomplete="username" required>
                                    </div>

                                    <div>
                                        <label class="form-label" for="password">Contraseña</label>
                                        <input class="form-control" type="password" id="password" name="password"
                                            autocomplete="new-password" required>
                                    </div>

                                    <div>
                                        <label class="form-label" for="passwordConfirmation">Confirmar
                                            contraseña</label>
                                        <input class="form-control" type="password" id="passwordConfirmation"
                                            name="passwordConfirmation" autocomplete="new-password" required>
                                    </div>

                                    <div>
                                        <label class="form-label" for="role">Rol</label>
                                        <select id="role" name="role" class="form-select" required>
                                            <option value="" selected disabled>Elige el rol</option>
                                            <option value="ROLE_ADMIN">Administrador</option>
                                            <option value="ROLE_USER">Vendedor</option>
                                        </select>
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100">Guardar usuario</button>
                                </div>
                            </form>
                        </div>
                    </section>

                    <section class="panel" aria-labelledby="lista-usuarios-title">
                        <div class="panel-header">
                            <div>
                                <h2 class="panel-title" id="lista-usuarios-title">Usuarios registrados</h2>
                                <p class="panel-subtitle">Marca una fila para habilitar la eliminación.</p>
                            </div>
                        </div>

                        <div class="panel-body panel-body-flush">
                            <div id="tablaContainerUsuarios" class="table-responsive">
                                <table id="tablaUsuarios" class="table table-hover align-middle">
                                    <thead>
                                        <tr>
                                            <th scope="col">ID</th>
                                            <th scope="col">Usuario</th>
                                            <th scope="col">Rol</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>

                        <div class="panel-footer panel-footer-between">
                            <p class="selection-note" id="selectionNote">Ningún usuario seleccionado.</p>
                            <form id="formEliminarUsuario" action="/eliminarUsuario" method="POST">
                                <input type="hidden" name="id" id="usuarioSeleccionadoId">
                                <button type="submit" id="btnEliminarUsuario" class="btn btn-danger" disabled>Eliminar
                                    usuario</button>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        $(document).ready(function () {

            function cargarUsuarios() {
                $.ajax({
                    url: '/obtenerUsuarios',
                    method: 'GET',
                    success: function (usuarios) {
                        const tbody = $('#tablaUsuarios tbody');
                        tbody.empty();

                        if (usuarios.length > 0) {
                            usuarios.forEach(u => {
                                const roles = u.roles ? Array.from(u.roles) : [];
                                const rolRaw = roles[0] || 'ROLE_USER';
                                const esAdmin = rolRaw === 'ROLE_ADMIN';
                                const rolLabel = esAdmin ? 'Administrador' : 'Vendedor';
                                const rolClass = esAdmin ? 'pill-fresa' : 'pill-pistacho';
                                const idSeguro = escapeHtml(u.id);
                                const usuarioSeguro = escapeHtml(u.username);

                                tbody.append(`
                                    <tr class="fila-usuario" data-id="${idSeguro}" data-usuario="${usuarioSeguro}" tabindex="0" aria-selected="false">
                                        <td><span class="user-id" title="${idSeguro}">${idSeguro}</span></td>
                                        <td><strong>${usuarioSeguro}</strong></td>
                                        <td><span class="pill ${rolClass}">${rolLabel}</span></td>
                                    </tr>
                                `);
                            });
                        } else {
                            tbody.append('<tr><td colspan="3"><div class="empty-state"><strong>No hay usuarios registrados</strong><p>Crea el primero con el formulario de la izquierda.</p></div></td></tr>');
                        }
                    }
                });
            }

            cargarUsuarios();

            function seleccionarFila(fila) {
                $('.fila-usuario').removeClass('table-active').attr('aria-selected', 'false');
                $(fila).addClass('table-active').attr('aria-selected', 'true');

                const id = $(fila).data('id');
                const usuario = $(fila).data('usuario');
                $('#usuarioSeleccionadoId').val(id);
                $('#selectionNote').text(`Seleccionado: ${usuario}`);
                $('#btnEliminarUsuario').prop('disabled', false);
            }

            $(document).on('click', '.fila-usuario', function () {
                seleccionarFila(this);
            });

            $(document).on('keydown', '.fila-usuario', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    seleccionarFila(this);
                }
            });

            $('#formEliminarUsuario').on('submit', function (e) {
                e.preventDefault();
                const id = $('#usuarioSeleccionadoId').val();
                const usuario = $('#selectionNote').text().replace('Seleccionado: ', '');
                if (!id) return;

                Swal.fire({
                    title: '¿Eliminar este usuario?',
                    text: `Vas a eliminar el acceso de ${usuario}. Esta acción no se puede deshacer.`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#C42B3E',
                    cancelButtonColor: '#6E5C55',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar',
                    background: '#FFF8EE',
                    color: '#241A17'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.post('/eliminarUsuario', { id: id })
                            .done(() => {
                                Swal.fire({
                                    title: 'Usuario eliminado',
                                    text: 'El acceso se eliminó correctamente.',
                                    icon: 'success',
                                    confirmButtonColor: '#D9186A',
                                    background: '#FFF8EE',
                                    color: '#241A17'
                                });
                                $('#btnEliminarUsuario').prop('disabled', true);
                                $('#usuarioSeleccionadoId').val('');
                                $('#selectionNote').text('Ningún usuario seleccionado.');
                                cargarUsuarios();
                            })
                            .fail(() => {
                                Swal.fire({
                                    title: 'No se pudo eliminar',
                                    text: 'Intenta de nuevo en unos segundos.',
                                    icon: 'error',
                                    confirmButtonColor: '#D9186A',
                                    background: '#FFF8EE',
                                    color: '#241A17'
                                });
                            });
                    }
                });
            });
        });
    </script>

    <script>
        setTimeout(function () {
            document.querySelectorAll('.alert').forEach(function (alert) {
                bootstrap.Alert.getOrCreateInstance(alert).close();
            });
        }, 6000);
    </script>
</body>

</html>
