<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de ventas — Ice Cream</title>
    <link rel="icon" href="/img/heladoCool.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/styleHome.css">
    <link rel="stylesheet" href="/css/CSS_Reporte.css">
</head>

<body>
    <div class="main-container">
        <aside class="sidebar">
            <div th:replace="~{sidebar :: sidebar}"></div>
        </aside>

        <main class="content-area">
            <div class="admin-page">
                <header class="content-header">
                    <div>
                        <h1>Reporte de ventas</h1>
                        <p>Tablero interactivo de Power BI con las métricas del negocio.</p>
                    </div>
                    <div class="header-actions">
                        <a href="/reporteOpciones" class="btn btn-secondary">Volver a reportes</a>
                        <a href="https://app.powerbi.com/view?r=eyJrIjoiOTQyOGY4ODQtYTM4Ny00NWFmLWFiNmQtNDlkYWVjYWFlMGFkIiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9"
                            class="btn btn-primary" target="_blank" rel="noopener noreferrer">Abrir en Power BI</a>
                    </div>
                </header>

                <section class="panel" aria-labelledby="powerbi-title">
                    <div class="panel-header">
                        <div>
                            <h2 class="panel-title" id="powerbi-title">Panel estadístico</h2>
                            <p class="panel-subtitle">Ventas, productos y comportamiento del negocio.</p>
                        </div>
                    </div>

                    <div class="panel-body">
                        <div class="report-frame">
                            <iframe title="Reporte de ventas Ice Cream en Power BI"
                                src="https://app.powerbi.com/view?r=eyJrIjoiOTQyOGY4ODQtYTM4Ny00NWFmLWFiNmQtNDlkYWVjYWFlMGFkIiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9"
                                frameborder="0" allowfullscreen="true" loading="lazy"></iframe>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>

</html>
