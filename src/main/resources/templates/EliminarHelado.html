<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar helado — Ice Cream</title>
    <link rel="icon" href="/img/heladoCool.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/styleHome.css">
    <link rel="stylesheet" href="/css/CSS_EliminarHelado.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="main-container">
        <aside class="sidebar">
            <div th:replace="~{sidebar :: sidebar}"></div>
        </aside>

        <main class="content-area">
            <div class="admin-page">
                <header class="content-header">
                    <div>
                        <h1>Eliminar helado</h1>
                        <p>Retira un producto del almacén o del mostrador. Esta acción no se puede deshacer.</p>
                    </div>
                    <div class="header-actions">
                        <a href="/home" class="btn btn-secondary">Volver al panel</a>
                    </div>
                </header>

                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="status">
                    <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>

                <form id="eliminarForm" action="/eliminarHelado" method="post">
                    <section class="panel" aria-labelledby="eliminar-title">
                        <div class="panel-header">
                            <div>
                                <h2 class="panel-title" id="eliminar-title">Selecciona el helado</h2>
                                <p class="panel-subtitle">Primero elige la ubicación y después marca el producto.</p>
                            </div>
                        </div>

                        <div class="panel-body">
                            <div class="filter-row">
                                <label for="ubicacionSelect" class="form-label">Ubicación</label>
                                <select id="ubicacionSelect" name="ubicacion" class="form-select" required>
                                    <option value="" selected>Elige la ubicación</option>
                                    <option value="almacen">Almacén</option>
                                    <option value="heladeria">Heladería</option>
                                </select>
                            </div>

                            <div id="tablaContainer" class="table-responsive" style="display: none;">
                                <table id="tablaHelados" class="table table-hover align-middle">
                                    <thead>
                                        <tr>
                                            <th scope="col">Nombre</th>
                                            <th scope="col">Sabor</th>
                                            <th scope="col">Tipo</th>
                                            <th scope="col">Unidades</th>
                                            <th scope="col">Precio</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>

                        <div class="panel-footer panel-footer-between">
                            <p class="selection-note" id="selectionNote">Ningún helado seleccionado.</p>
                            <input type="hidden" name="nombre" id="nombreHeladoSeleccionado">
                            <button type="button" id="btnEliminar" class="btn btn-danger" disabled>Eliminar
                                helado</button>
                        </div>
                    </section>
                </form>
            </div>
        </main>
    </div>

    <script>
        function formatCOP(value) {
            return '$' + Number(value).toLocaleString('es-CO', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }) + ' COP';
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        $(document).ready(function () {
            $('#ubicacionSelect').on('change', function () {
                const ubicacion = $(this).val();
                $('#tablaContainer').hide();
                $('#tablaHelados tbody').empty();
                $('#btnEliminar').prop('disabled', true);
                $('#nombreHeladoSeleccionado').val('');
                $('#selectionNote').text('Ningún helado seleccionado.');

                if (ubicacion !== '') {
                    $.ajax({
                        url: '/obtenerHeladosPorUbicacion',
                        method: 'POST',
                        data: { ubicacion: ubicacion },
                        success: function (helados) {
                            if (helados.length > 0) {
                                helados.forEach(h => {
                                    $('#tablaHelados tbody').append(`
                                        <tr class="fila-helado" data-nombre="${escapeHtml(h.nombre)}" tabindex="0">
                                            <td>${escapeHtml(h.nombre)}</td>
                                            <td>${escapeHtml(h.sabor)}</td>
                                            <td>${escapeHtml(h.tipo)}</td>
                                            <td>${h.unidades}</td>
                                            <td>${formatCOP(h.precio)}</td>
                                        </tr>
                                    `);
                                });
                            } else {
                                $('#tablaHelados tbody').append('<tr><td colspan="5" class="text-center text-muted">No hay helados disponibles en esta ubicación.</td></tr>');
                            }
                            $('#tablaContainer').fadeIn();
                        }
                    });
                }
            });

            $(document).on('click', '.fila-helado', function () {
                $('.fila-helado').removeClass('table-active').attr('aria-selected', 'false');
                $(this).addClass('table-active').attr('aria-selected', 'true');
                const nombre = $(this).data('nombre');
                $('#nombreHeladoSeleccionado').val(nombre);
                $('#selectionNote').text(`Seleccionado: ${nombre}`);
                $('#btnEliminar').prop('disabled', false);
            });

            $(document).on('keydown', '.fila-helado', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    $(this).trigger('click');
                }
            });

            $('#btnEliminar').on('click', function (e) {
                e.preventDefault();
                const nombre = $('#nombreHeladoSeleccionado').val();
                const ubicacion = $('#ubicacionSelect').val();

                if (!nombre) return;

                Swal.fire({
                    title: '¿Eliminar este helado?',
                    text: `Vas a eliminar "${nombre}" de ${ubicacion === 'almacen' ? 'el almacén' : 'la heladería'}. Esta acción no se puede deshacer.`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#C42B3E',
                    cancelButtonColor: '#6E5C55',
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar',
                    background: '#FFF8EE',
                    color: '#241A17'
                }).then((result) => {
                    if (result.isConfirmed) {
                        $('#eliminarForm').off('submit').submit();
                    }
                });
            });
        });
    </script>

    <script>
        setTimeout(function () {
            document.querySelectorAll('.alert').forEach(function (alert) {
                bootstrap.Alert.getOrCreateInstance(alert).close();
            });
        }, 6000);
    </script>
</body>

</html>
