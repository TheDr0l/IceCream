services:
  app:
    build: .
    container_name: icecream_app
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      # Configuracion para MySQL (local)
      #SPRING_DATA_MYSQL_URI: ${SPRING_DATA_MYSQL_URI}
      SPRING_DATA_MYSQL_URI: jdbc:mysql://host.docker.internal:3306/db_icecream
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # Configuracion para MongoDB (Atlas)
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
      
      # Email
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}

      # Inteligencia Artificial
      GROQ_API_KEY: ${GROQ_API_KEY}

