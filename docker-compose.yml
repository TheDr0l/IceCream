services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icecream-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # La app se conecta a MongoDB Atlas usando la URI definida en .env
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:?Define SPRING_DATA_MONGODB_URI en .env}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-not-configured}
